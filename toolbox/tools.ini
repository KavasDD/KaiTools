; ==========================================================================
;  小开工具箱 - 工具清单
; ==========================================================================
;
;  加一个新工具 = 在这里加一段,不用改代码、不用重新编译。
;  工具箱启动时读这个文件,顺序就是界面里的显示顺序。
;
;  段格式:
;
;    [显示名称]
;    category = 左侧分类名(必须出现在下面 [toolbox] order 里)
;    exe      = 可执行文件路径,支持下面的占位符
;    args     = 命令行参数,没有就留空
;    desc     = 单击工具时提示栏显示的说明
;    icon     = 可选。默认从 exe 里抽图标,填了这个就用指定文件的图标
;
;  占位符:
;
;    %SPB%      Cadence 安装目录,如 C:\orcad\Cadence\SPB_17.4
;               运行时探测:CDS_INST_DIR 环境变量 -> 注册表 -> 常见路径
;               绝不能写死,因为这台机器就装在 C:\orcad\ 而不是默认的 C:\
;    %CADROOT%  SPB 的上一级,如 C:\orcad\Cadence
;               LicenseManager 这类不在 SPB 里的工具用它
;    %TOOLBOX%  工具箱自己所在的目录,自研工具用它
;
;  找不到的工具不会消失,会灰掉并在说明里写明原因 —— 比"这个工具怎么没了"好排查。
;
; ==========================================================================

[toolbox]
; 左侧分类的显示顺序。这里没列到的分类排在后面,不会被丢掉。
order = OrCAD 工具 | Allegro 工具 | PSpice 工具 | 库与转换 | 其他辅助工具 | 许可证工具 | 帮助与文档

; ---------------------------------------------------------------- OrCAD ---

[Capture CIS]
category = OrCAD 工具
exe  = %SPB%\tools\bin\Capture.exe
desc = 原理图设计主程序,带元件信息系统(CIS)。lceda2orcad 插件就装在它里面。

[Capture Viewer]
category = OrCAD 工具
exe  = %SPB%\tools\bin\Capture.exe
args = -viewer
desc = 只读方式打开原理图,不占用 License —— 给不需要改图的人看图用。

[Design Entry HDL]
category = OrCAD 工具
exe  = %SPB%\tools\bin\concepthdl.exe
desc = Concept HDL 原理图输入环境,走 Allegro 前端流程时用这个而不是 Capture。

[Project Manager]
category = OrCAD 工具
exe  = %SPB%\tools\bin\projmgr.exe
desc = 工程管理器,统一管理原理图、PCB、物料和输出。

; -------------------------------------------------------------- Allegro ---

[PCB Editor]
category = Allegro 工具
exe  = %SPB%\tools\bin\allegro.exe
desc = Allegro PCB Editor 主程序。Constraint Manager 不是独立 exe,从它里面 Setup 菜单进。

[PCB Editor Viewer]
category = Allegro 工具
exe  = %SPB%\tools\bin\allegro_free_viewer.exe
desc = 免费 PCB 查看器,不占 License,能看能测量能打印但不能改。

[Padstack Editor]
category = Allegro 工具
exe  = %SPB%\tools\bin\padstack_editor.exe
desc = 焊盘叠层编辑器,做封装前先在这里定义 padstack。

[PCB Router]
category = Allegro 工具
exe  = %SPB%\tools\bin\specctra.exe
desc = Specctra 自动布线器。

[PCB Batch DRC]
category = Allegro 工具
exe  = %SPB%\tools\bin\batch_drc.exe
desc = 批量 DRC 检查,不开图形界面直接出报告。

[PCB DB Doctor]
category = Allegro 工具
exe  = %SPB%\tools\bin\dbdoctor_ui.exe
desc = 数据库体检和修复。brd 文件打不开或行为异常时先跑这个。

[PCB Environment Editor]
category = Allegro 工具
exe  = %SPB%\tools\bin\enved.exe
desc = 编辑 Allegro 环境变量,改 pad/psm 搜索路径就在这里。

[SigXplorer]
category = Allegro 工具
exe  = %SPB%\tools\bin\sigxp.exe
desc = 拓扑与信号完整性分析,提取传输线模型看波形。

[SigWave]
category = Allegro 工具
exe  = %SPB%\tools\bin\sigwave.exe
desc = 仿真波形查看器。

[APD+]
category = Allegro 工具
exe  = %SPB%\tools\bin\apd.exe
desc = 封装与基板设计(Advanced Package Designer)。

; --------------------------------------------------------------- PSpice ---

[PSpice AD]
category = PSpice 工具
exe  = %SPB%\tools\bin\pspice.exe
desc = 模拟/数字混合仿真主程序。

[PSpice Advanced Analysis]
category = PSpice 工具
exe  = %SPB%\tools\bin\pspiceaa.exe
desc = 高级分析:灵敏度、优化、蒙特卡洛、应力分析。

[PSpice Model Editor]
category = PSpice 工具
exe  = %SPB%\tools\bin\ModelEd.exe
desc = 编辑和创建 PSpice 器件模型。厂家给了 .lib 但没有符号时用它。

[PSpice Stimulus Editor]
category = PSpice 工具
exe  = %SPB%\tools\bin\stmed.exe
desc = 图形化编辑激励源波形。

[PSpice Simulation Manager]
category = PSpice 工具
exe  = %SPB%\tools\bin\simmgr.exe
desc = 管理多个仿真任务的队列和进度。

[PSpice Magnetic Parts Editor]
category = PSpice 工具
exe  = %SPB%\tools\bin\Magneticdesigner.exe
desc = 变压器和电感设计。

; ---------------------------------------------------------- 库与转换 ---

[Allegro Library Creator]
category = 库与转换
exe  = %SPB%\tools\lcclient\bin\libcreator.exe
desc = 从表格批量生成 Allegro 封装库。

[Library Explorer]
category = 库与转换
exe  = %SPB%\tools\bin\libexp.exe
desc = 浏览和管理元件库。

[Model Integrity]
category = 库与转换
exe  = %SPB%\tools\bin\modelintegrity.exe
desc = 检查库模型的完整性和一致性。

[PADS Translator]
category = 库与转换
exe  = %SPB%\tools\bin\pads_in.exe
desc = 把 PADS 设计导入 Allegro。

[P-CAD Translator]
category = 库与转换
exe  = %SPB%\tools\bin\pcad_in.exe
desc = 把 P-CAD 设计导入 Allegro。

; ------------------------------------------------------------- 自研工具 ---
; 这些不单独占一个分类。带 mine = 1 的会出现在**对应分类**页面的下半区 ——
; 找"画原理图用的自研工具"就该在 OrCAD 工具那一页往下看,而不是先想起来
; 它是谁写的、再去另一个分类里翻。
;
[嘉立创 3D 模型下载器 v2.0]
category = 库与转换
mine = 1
exe  = %TOOLBOX%\JLC3D-Downloader.exe
; exe 里已经嵌了同一个图标,这里再指一次是为了 exe 还没打出来时格子上也有图 ——
; 抽不到图标会退回字母占位块,看着像图标做坏了。
icon = %TOOLBOX%\jlc3d.ico
desc = 按立创商品编号下载 STEP 3D 模型。
help = 输入一个或多个立创商品编号并选择下载目录；需联网，仅下载 STEP 模型。

; ------------------------------------------------------- 其他辅助工具 ---
; 开发辅助工具和启动维护工具放这里。

[OrCAD 启动优化工具 v1.0]
category = 其他辅助工具
mine = 1
exe = %TOOLBOX%\OrCAD启动优化工具.exe
desc = 备份后停用可选启动功能，支持恢复。
help = 选择要停用的启动功能并应用；工具会备份文件，需要时可恢复。操作前关闭 Capture。

[元器件规格描述生成器 v1.0]
category = 其他辅助工具
mine = 1
exe  = %TOOLBOX%\元器件规格描述生成器.exe
; exe 本身没嵌图标,不给 icon 的话抽出来是系统的通用程序图标。
icon = %TOOLBOX%\specgen.ico
desc = 按立创商品编号生成标准化元器件规格描述。
help = 选择物料类别并输入商品编号或链接；抓取参数后可编辑并复制规格描述。需联网。

[DWG 转 DXF v1.0]
category = 其他辅助工具
mine = 1
exe  = %TOOLBOX%\dwg2dxf.exe
icon = %TOOLBOX%\dwg2dxf.ico
desc = DWG 转 DXF，支持 Allegro 兼容模式。
help = 选择 DWG 文件并转换；Allegro 兼容模式会处理填充、线宽和图层名。

[STEP 转 DXF v1.0]
category = 其他辅助工具
mine = 1
exe  = %TOOLBOX%\step2dxf.exe
icon = %TOOLBOX%\step2dxf.ico
desc = STEP/STP 三维模型转 DXF 顶、前、左视图。
help = 选择 STEP 文件并转换；输出三张以毫米为单位的 DXF 视图。

[Gerber 转 DXF v1.0]
category = 其他辅助工具
mine = 1
exe  = %TOOLBOX%\gerber2dxf.exe
icon = %TOOLBOX%\gerber2dxf.ico
desc = Gerber 文件夹转 DXF，保留各文件图层。
help = 选择 Gerber 文件夹并导出；生成合并 DXF 和各 Gerber 文件对应的 DXF。

; ----------------------------------------------------------- 许可证工具 ---
; 注意这些在 %CADROOT% 下,不在 %SPB% 里 —— LicenseManager 是跨版本共用的。

[License 客户端配置]
category = 许可证工具
exe  = %CADROOT%\LicenseManager\LicenseClientConfiguration.exe
args = -user
desc = 配置 License 服务器地址。报 License 错误时先来这里确认服务器填对了。

[LmTools]
category = 许可证工具
exe  = %CADROOT%\LicenseManager\Lmtools.exe
desc = FlexLM 授权管理工具,查谁占用了 License、重启授权服务。

[License 服务器诊断]
category = 许可证工具
exe  = %CADROOT%\LicenseManager\LicenseServerDiagnostics.exe
desc = 诊断授权服务器连通性。

[切换 Cadence 版本]
category = 许可证工具
exe  = %SPB%\tools\bin\switchversion.exe
desc = 装了多个 SPB 版本时切换当前生效的版本。

; --------------------------------------------------------- 帮助与文档 ---

[Cadence Help]
category = 帮助与文档
exe  = %SPB%\tools\cdnshelp\bin\cdnshelp.exe
desc = 官方帮助文档总入口,可全文检索。

[官方教程]
category = 帮助与文档
exe  = %SPB%\tools\bin\tutorials.exe
desc = OrCAD 和 Allegro 的官方入门教程。

[本版新特性]
category = 帮助与文档
exe  = %SPB%\tools\bin\relpn.exe
desc = 当前版本相比旧版的变化说明。
