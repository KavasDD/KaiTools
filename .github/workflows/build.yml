name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install fixed build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build release from source
        shell: powershell
        run: ./scripts/build-release.ps1 -Python (Get-Command python).Source
      - name: Install Tcllib JSON test dependency
        shell: powershell
        run: |
          $jsonDir = Join-Path $env:RUNNER_TEMP 'xiaokai-tcllib-json'
          New-Item -ItemType Directory -Force -Path $jsonDir | Out-Null
          $base = 'https://raw.githubusercontent.com/tcltk/tcllib/2a63bf212cc6423efb7a39958596ae2a2333c266/modules/json'
          foreach ($file in @('pkgIndex.tcl', 'json.tcl', 'json_tcl.tcl', 'json_write.tcl')) {
            Invoke-WebRequest -UseBasicParsing -Uri "$base/$file" -OutFile (Join-Path $jsonDir $file)
          }
          ('TCLLIBPATH={' + $jsonDir.Replace('\', '/') + '}') | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Launcher and startup optimizer checks
        shell: powershell
        run: |
          ./toolbox/build.ps1 -Test
          ./toolbox/startupoptimizer/build.ps1 -Test
          ./scripts/test.ps1 -Python (Get-Command python).Source
      - name: Installer self test
        shell: powershell
        run: |
          $version = [regex]::Match([IO.File]::ReadAllText('toolbox/Toolbox.cs'), 'public const string Version\s*=\s*"([\d.]+)"').Groups[1].Value
          $p = Start-Process -WindowStyle Hidden -Wait -PassThru -FilePath "./toolbox/dist/XiaokaiToolbox-setup-v$version.exe" -ArgumentList '/selftest'
          Get-Content "$env:TEMP/xiaokai-setup-selftest.txt"
          if ($p.ExitCode -ne 0) { throw 'Installer self test failed' }
      - name: Export corresponding source and checksums
        shell: powershell
        run: ./scripts/package-release.ps1 -AllowGeneratedChanges
      - uses: actions/upload-artifact@v4
        with:
          name: xiaokai-toolbox
          path: artifacts/*
